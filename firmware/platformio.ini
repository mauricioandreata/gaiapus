; Gaiapus firmware. Same packet everywhere (include/gaiapus_protocol.h):
;   bench-esp32s3   : dev board + bought sensors, Wi-Fi/MQTT (same code as Wokwi)  -> src/main.cpp
;   stake-lora      : the stake PCB, product link: LoRa P2P to the gateway        -> src/stake/
;   stake-wifi      : the stake PCB without a gateway (demo): Wi-Fi/MQTT          -> src/stake/
;   stake-wifi-demo : stake-wifi with the 30 min cycle compressed to 1 min (video/pitch)
;   gateway         : community gateway on a Gaiapus head board (USB powered)        -> src/gateway/
;   gateway-heltec-v3 : same gateway on a Heltec WiFi LoRa 32 V3
; Wi-Fi credentials: add -DWIFI_SSID=\"name\" -DWIFI_PASS=\"pwd\" to build_flags
; (bench also needs -DWIFI_CHANNEL=0).
; Upload to the stake over USB-C. If no port shows up, hold the button while plugging USB
; (IO0 low at reset = download mode).

[env]
platform = espressif32
board = esp32-s3-devkitc-1        ; ESP32-S3-MINI-1-N8 = ESP32-S3FN8, 8 MB quad flash, no PSRAM
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:bench-esp32s3]
build_src_filter = +<main.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    beegee-tokyo/DHT sensor library for ESPx@^1.19

[env:stake-lora]
build_src_filter = +<stake/>
lib_deps =
    jgromes/RadioLib@^7.1
build_flags =
    ${env.build_flags}
    -DLINK_LORA=1

[env:stake-wifi]
build_src_filter = +<stake/>
lib_deps =
    jgromes/RadioLib@^7.1
    knolleary/PubSubClient@^2.8
build_flags =
    ${env.build_flags}
    -DLINK_WIFI=1

[env:stake-wifi-demo]
extends = env:stake-wifi
build_flags =
    ${env:stake-wifi.build_flags}
    -DSECONDS_PER_MIN=2

; ---------------------------------------------------------------- community gateway
; Mains/USB powered, never sleeps: LoRa P2P <-> Wi-Fi/MQTT. Radio settings shared with
; the stake (src/stake/config.h). Needs -DWIFI_SSID / -DWIFI_PASS like stake-wifi.
[gateway_common]
build_src_filter = +<gateway/> +<stake/radio.cpp>
lib_deps =
    jgromes/RadioLib@^7.1
    knolleary/PubSubClient@^2.8

; Default: a Gaiapus head board on USB-C (same PCB as the stake).
[env:gateway]
build_src_filter = ${gateway_common.build_src_filter}
lib_deps = ${gateway_common.lib_deps}
build_flags =
    ${env.build_flags}
    -Isrc/stake

; Alternative: off-the-shelf Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262, TCXO 1.8 V,
; RF switch on the module's DIO2). Pins from the Heltec V3 pin map.
[env:gateway-heltec-v3]
board = heltec_wifi_lora_32_V3
build_src_filter = ${gateway_common.build_src_filter}
lib_deps = ${gateway_common.lib_deps}
build_flags =
    ${env.build_flags}
    -Isrc/stake
    -DRADIO_NSS=8 -DRADIO_SCK=9 -DRADIO_MOSI=10 -DRADIO_MISO=11
    -DRADIO_NRST=12 -DRADIO_BUSY=13 -DRADIO_DIO1=14 -DRADIO_RXEN=-1 -DRADIO_TXEN=-1
    -DGW_LED_G=35 -DGW_LED_Y=-1 -DGW_LED_R=-1
