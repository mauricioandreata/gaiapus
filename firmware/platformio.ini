; Bench firmware on a real ESP32-S3 dev board (same code as Wokwi).
; For your own Wi-Fi: add -DWIFI_SSID=\"name\" -DWIFI_PASS=\"pwd\" -DWIFI_CHANNEL=0 to build_flags.
[env:bench-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    beegee-tokyo/DHT sensor library for ESPx@^1.19
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
